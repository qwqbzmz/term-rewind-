name: Publish container package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-container.yml
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - rewind.py
      - timeline.py
      - mcp_server.py

concurrency:
  group: publish-container

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the CLI image
        run: docker build --tag term-rewind:check .

      - name: Verify snapshot creation and recovery
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rewind-workspace" "$RUNNER_TEMP/rewind-store"
          printf 'original\n' > "$RUNNER_TEMP/rewind-workspace/draft.txt"
          run_rewind() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$RUNNER_TEMP/rewind-workspace:/workspace" \
              -v "$RUNNER_TEMP/rewind-store:/snapshots" term-rewind:check "$@"
          }
          run_rewind --version
          run_rewind run -- python -c "from pathlib import Path; Path('draft.txt').unlink()"
          test ! -f "$RUNNER_TEMP/rewind-workspace/draft.txt"
          run_rewind undo --yes
          test "$(cat "$RUNNER_TEMP/rewind-workspace/draft.txt")" = original

      - name: Push versioned image to GitHub Packages
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/term-rewind"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag term-rewind:check "$image:$version"
          docker tag term-rewind:check "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
